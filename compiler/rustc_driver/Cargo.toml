[package]
name = "rustc_driver"
version = "0.0.0"
edition = "2024"

[lib]
# rlib in addition to dylib: on targets without dynamic linking (Motor OS)
# rustc drops the dylib crate type with a warning and the rustc binary links
# rustc_driver statically from the rlib.
crate-type = ["dylib", "rlib"]

[dependencies]
# tidy-alphabetical-start
rustc_driver_impl = { path = "../rustc_driver_impl" }
# tidy-alphabetical-end

[build-dependencies]
# tidy-alphabetical-start
rustc_windows_rc = { path = "../rustc_windows_rc" }
# tidy-alphabetical-end
